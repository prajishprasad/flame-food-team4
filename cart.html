{% extends "base.html" %}

{% block content %}

<nav>
    <a href="/">Home</a>
    <a href="/cart">Cart ({{ cart|length }})</a>
    <a href="/orders">Orders</a>
</nav>

<h1>Cart</h1>

{% if cart %}
    <ul>
        {% for item in cart %}
            <li>
                {{ item.name }} - {{ item.price }}
            </li>
        {% endfor %}
    </ul>

    <form action="/checkout" method="post">
        <button type="submit">Checkout</button>
    </form>
{% else %}
    <p>Your cart is empty.</p>
{% endif %}

{% endblock %}
